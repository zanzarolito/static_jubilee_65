<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App — MCP Tutorial</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📝 Todo App</h1>
        <p class="subtitle">Application de démonstration pour le TP MCP</p>
      </header>

      <!-- Add task form -->
      <section class="add-task">
        <h2>Ajouter une tâche</h2>
        <form id="addTaskForm">
          <div class="form-group">
            <input
              type="text"
              id="taskTitle"
              placeholder="Titre de la tâche..."
              required
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <textarea
              id="taskDescription"
              placeholder="Description (optionnelle)..."
              rows="2"
            ></textarea>
          </div>
          <button type="submit" class="btn btn-primary">+ Ajouter</button>
        </form>
      </section>

      <!-- Filter bar -->
      <section class="filters">
        <h2>Mes tâches</h2>
        <div class="filter-buttons">
          <button class="btn btn-filter active" data-filter="all">Toutes</button>
          <button class="btn btn-filter" data-filter="pending">En cours</button>
          <button class="btn btn-filter" data-filter="done">Terminées</button>
        </div>
      </section>

      <!-- Task list -->
      <section class="task-list">
        <div id="taskList">
          <p class="loading">Chargement...</p>
        </div>
        <div id="emptyState" class="empty-state hidden">
          <p>Aucune tâche pour le moment. Ajoutez-en une ci-dessus !</p>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
