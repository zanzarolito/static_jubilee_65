name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            todo-app/package-lock.json
            mcp-server/package-lock.json

      - name: Install todo-app dependencies
        working-directory: todo-app
        run: npm ci

      - name: Typecheck todo-app
        working-directory: todo-app
        run: npm run typecheck

      - name: Install mcp-server dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Typecheck mcp-server
        working-directory: mcp-server
        run: npm run typecheck

  test-mcp-tools-list:
    name: MCP tools/list smoke test
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mcp-server dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Verify tools/list returns 4 tools
        working-directory: mcp-server
        run: |
          OUTPUT=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | npx tsx src/index.ts 2>/dev/null)
          echo "MCP response: $OUTPUT"
          echo "$OUTPUT" | grep -q '"list_tasks"' || (echo "ERROR: list_tasks not found" && exit 1)
          echo "$OUTPUT" | grep -q '"add_task"' || (echo "ERROR: add_task not found" && exit 1)
          echo "$OUTPUT" | grep -q '"complete_task"' || (echo "ERROR: complete_task not found" && exit 1)
          echo "$OUTPUT" | grep -q '"delete_task"' || (echo "ERROR: delete_task not found" && exit 1)
          echo "✅ All 4 tools registered correctly"
